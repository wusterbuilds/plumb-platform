<svg xmlns="http://www.w3.org/2000/svg" width="200" height="50" viewBox="0 0 200 50">
  <!-- Plumb bob icon -->
  <g transform="translate(20, 4)">
    <!-- Suspension point / top ring -->
    <circle cx="12" cy="3" r="2.5" fill="none" stroke="#0D5295" stroke-width="1.8"/>
    <!-- Plumb line -->
    <line x1="12" y1="5.5" x2="12" y2="14" stroke="#0D5295" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Bob body - stylized geometric teardrop/cone -->
    <path d="M12 14 L5 28 Q5 34 8.5 37 Q10 38.5 12 39 Q14 38.5 15.5 37 Q19 34 19 28 Z"
          fill="url(#bobGradient)" stroke="none"/>
    <!-- Highlight facet on bob - modern geometric cut -->
    <path d="M12 14 L8 26 L12 35 L16 26 Z" fill="#0D5295" opacity="0.25"/>
    <!-- Center line accent on bob -->
    <line x1="12" y1="18" x2="12" y2="33" stroke="#00B8D4" stroke-width="1" opacity="0.6" stroke-linecap="round"/>
    <!-- Tip accent dot -->
    <circle cx="12" cy="38" r="1" fill="#00B8D4"/>
  </g>

  <!-- Gradient definition -->
  <defs>
    <linearGradient id="bobGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D5295"/>
      <stop offset="100%" stop-color="#00B8D4"/>
    </linearGradient>
  </defs>

  <!-- Wordmark -->
  <text x="58" y="36" font-family="Inter, Helvetica Neue, sans-serif" font-size="28" font-weight="700" fill="#0D5295" letter-spacing="3">PLUMB</text>
</svg>
