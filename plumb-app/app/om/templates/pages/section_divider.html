{% extends "base.html" %}

{% block content %}
<div class="section-divider" style="display: flex; flex-direction: column; align-items: center; justify-content: center;">
  {# Subtle diagonal accent in top-right corner #}
  <div style="position: absolute; top: 0; right: 0; width: 40%; height: 100%; background: linear-gradient(135deg, transparent 0%, rgba(0, 184, 212, 0.06) 100%);"></div>
  {# Accent bar at bottom of page #}
  <div style="position: absolute; bottom: 0; left: 0; width: 100%; height: 4px; background: var(--plumb-accent);"></div>
  {# Centered title with accent underline #}
  <div style="text-align: center; position: relative;">
    <span class="section-title" style="font-size: 38px; letter-spacing: 3px; display: block; margin-bottom: 16px;">{{ ctx.title }}</span>
    <div style="width: 80px; height: 3px; background: var(--plumb-accent); margin: 0 auto;"></div>
  </div>
  {# Logo watermark at bottom-center #}
  {% if ctx.logo_path %}
  <img src="{{ ctx.logo_path }}" alt="" style="position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%); height: 24px; opacity: 0.3; filter: brightness(0) invert(1);">
  {% endif %}
</div>
{% endblock %}
