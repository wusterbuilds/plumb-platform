{% extends "base.html" %}

{% block content %}
<div class="back-cover">
  {# Subtle diagonal accent matching section dividers #}
  <div style="position: absolute; top: 0; right: 0; width: 40%; height: 100%; background: linear-gradient(135deg, transparent 0%, rgba(0, 184, 212, 0.06) 100%);"></div>
  {# Accent bar at bottom #}
  <div style="position: absolute; bottom: 0; left: 0; width: 100%; height: 4px; background: var(--plumb-accent);"></div>
  {# Centered logo #}
  <img src="{{ ctx.logo_path }}" alt="Plumb" class="back-logo">
  {# Confidential notice #}
  <div style="position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); font-family: var(--font-body); font-size: 9px; color: rgba(255,255,255,0.5); letter-spacing: 2px; text-transform: uppercase;">
    Confidential Financing Memorandum
  </div>
</div>
{% endblock %}
