<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <defs>
    <linearGradient id="iconGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D5295"/>
      <stop offset="100%" stop-color="#00B8D4"/>
    </linearGradient>
  </defs>

  <!-- Suspension point / top ring -->
  <circle cx="20" cy="3" r="2.5" fill="none" stroke="#0D5295" stroke-width="1.8"/>
  <!-- Plumb line -->
  <line x1="20" y1="5.5" x2="20" y2="13" stroke="#0D5295" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Bob body - stylized geometric teardrop/cone -->
  <path d="M20 13 L12 28 Q12 34 16 37 Q18 38.5 20 39 Q22 38.5 24 37 Q28 34 28 28 Z"
        fill="url(#iconGradient)" stroke="none"/>
  <!-- Highlight facet - geometric cut for modern feel -->
  <path d="M20 13 L15 26 L20 35 L25 26 Z" fill="#0D5295" opacity="0.25"/>
  <!-- Center line accent -->
  <line x1="20" y1="17" x2="20" y2="33" stroke="#00B8D4" stroke-width="1.2" opacity="0.6" stroke-linecap="round"/>
  <!-- Tip accent dot -->
  <circle cx="20" cy="38" r="1.2" fill="#00B8D4"/>
</svg>
