[project]
name = "plumb-app"
version = "0.1.0"
description = "Agent-native capital-advisory backend for commercial real estate"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.4",
    "email-validator>=2.0.0",
    "anthropic>=0.89.0",
    "asyncpg>=0.31.0",
    "boto3>=1.42.83",
    "celery[redis]>=5.6.3",
    "fastapi>=0.135.3",
    "jinja2>=3.1.0",
    "openpyxl>=3.1.0",
    "passlib[bcrypt]>=1.7.4",
    "pikepdf>=9.0.0",
    "pillow>=10.0.0",
    "playwright>=1.49.0",
    "psycopg2-binary>=2.9.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.13.1",
    "pymupdf>=1.25.0",
    "PyJWT[crypto]>=2.12.0",
    "python-multipart>=0.0.23",
    "redis>=6.4.0",
    "sqlalchemy[asyncio]>=2.0.49",
    "uvicorn[standard]>=0.43.0",
    "xlsxwriter>=3.2.0",
    "google-api-python-client>=2.100.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
